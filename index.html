<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #1a1a1c;
    color: #ffffff;
    font: 16px/1.65, Roboto;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: clamp(56px, 12vw, 104px) 64px;
  }

  h1 { font-size: 1.85rem; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .role { color: #9a9aa2; margin: 6px 0 0; }

  h2 {
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: #9a9aa2;
    margin: clamp(38px, 7vw, 52px) 0 14px;
  }
  p { margin: 0 0 1em; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid #2e2e34; }
  li:last-child { border-bottom: 1px solid #2e2e34; }
  li a { display: block; padding: 15px 0; color: inherit; text-decoration: none; }
  li a:hover { color: #8fb0ff; }
</style>

<main>
  <h1>Alexander Schwarz</h1>
  <p class="role">Universal Design</p>

  <h2>About</h2>
  <p>I'm a Senior Computer Science Major with a focus in Machine Learning and AI. Love my cats, video games, and running.</p>
